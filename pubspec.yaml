name: care_connect
description: Smart Elderly Care System

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.10
  firebase_storage: ^11.6.0

  # Location
  geolocator: ^10.0.0
  google_maps_flutter: ^2.5.3

  # Voice and Speech
  speech_to_text: ^6.3.0
  flutter_tts: ^3.8.3

  # Camera
  image_picker: ^1.0.4

  # Notifications
  flutter_local_notifications: ^16.3.2

  # UI
  provider: ^6.1.1
  intl: ^0.19.0

  # HTTP
  http: ^1.1.2

  # Sensors for fall detection
  sensors_plus: ^4.0.1

  # Video calls (using Agora)
  agora_rtc_engine: ^6.2.6

  # SMS (using Twilio via backend, but for demo, use url_launcher)
  url_launcher: ^6.2.1

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/

  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700